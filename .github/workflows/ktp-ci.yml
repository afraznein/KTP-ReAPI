# KTP CI — build gate + dual-copy header drift check for the fleet branch.
#
# The upstream workflow (build.yml, "C/C++ CI") is upstream's release pipeline and
# is dormant here — it wants signing secrets and a `master` branch the fork does
# not have. This file is the KTP gate instead, mirroring KTP-ReHLDS/ktp-ci.yml.
#
# Three jobs:
#  - header-drift: rehlds_api.h is manually duplicated between this repo and
#    KTP-ReHLDS. Vtable drift produces silent wrong-function calls with NO
#    compile error. KTP-ReHLDS runs the same check, but only on ITS pushes —
#    so a change made on this side was ungated until this job existed.
#    Compares against a same-named branch on KTP-ReHLDS when one exists, else its
#    default branch. The byte-diff is unconditional either way, and the run
#    on main after merge still compares main against main.
#  - build-linux: compile gate only. Fleet binaries are built locally and
#    verified by md5; the CI artifact is never the deploy artifact.
#  - build-windows: compile gate only — nothing here ships a .dll. It exists
#    because the MSVC project and CMakeLists carry INDEPENDENT source lists, and
#    the vcxproj silently missed extension_mode.cpp for ~8 months while Linux
#    built fine. Only a Windows compile catches that class of drift.

name: KTP CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehlds_ref:
        description: 'KTP-ReHLDS ref to diff rehlds_api.h against. Blank = the same-named branch if it exists, else its default branch.'
        required: false
        type: string
        default: ''

jobs:
  header-drift:
    name: rehlds_api.h drift vs KTP-ReHLDS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KTP-ReAPI
        uses: actions/checkout@v6

      # Checking out the counterpart with no ref reads its DEFAULT branch, so a
      # coordinated header change on feature branches in both repos failed on both
      # sides until one merged. Prefer a same-named branch; else the default.
      - name: Resolve KTP-ReHLDS ref
        id: counterpart
        env:
          COUNTERPART: https://github.com/afraznein/KTP-ReHLDS.git
          OVERRIDE: ${{ inputs.rehlds_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            REF="$OVERRIDE"
            echo "dispatch override: $REF"
          elif [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$COUNTERPART" "refs/heads/$BRANCH" >/dev/null 2>&1; then
            REF="$BRANCH"
            echo "matched same-named branch on KTP-ReHLDS: $REF"
          else
            REF=$(git ls-remote --symref "$COUNTERPART" HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2; exit }')
            echo "no matching branch on KTP-ReHLDS; using its default branch: $REF"
          fi
          # An empty ref makes checkout take the default branch, so a probe that
          # died would read as a passing comparison instead of a failure.
          test -n "$REF" || { echo "::error::could not resolve a KTP-ReHLDS ref to compare against"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout KTP-ReHLDS
        uses: actions/checkout@v6
        with:
          repository: afraznein/KTP-ReHLDS
          ref: ${{ steps.counterpart.outputs.ref }}
          path: ktprehlds

      - name: Diff the dual copies
        run: |
          if diff -u reapi/include/cssdk/engine/rehlds_api.h ktprehlds/rehlds/public/rehlds/rehlds_api.h; then
            echo "rehlds_api.h copies are byte-identical (KTP-ReHLDS @ ${{ steps.counterpart.outputs.ref }})"
          else
            echo "::error::rehlds_api.h has DRIFTED between KTP-ReAPI and KTP-ReHLDS. Vtable drift = silent wrong-function calls at runtime. Hook slots are APPEND-ONLY; sync both copies in the same change window. Compared against KTP-ReHLDS @ ${{ steps.counterpart.outputs.ref }}."
            exit 1
          fi

  build-linux:
    name: Linux GCC 32-bit build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake gcc-multilib g++-multilib

      - name: Build
        run: |
          sed -i 's/\r$//' build.sh
          chmod +x build.sh
          bash build.sh -j=$(nproc)

      # build.sh exits 0 even when the compile failed (upstream behaviour, and the
      # reason RA-02 existed). Its exit code proves nothing — the artifact is the
      # only gate, so require one that is NEWER than this run.
      - name: Verify artifacts
        run: |
          set -e
          SO=$(find build -name reapi_ktp_i386.so | head -1)
          test -n "$SO" || { echo "::error::reapi_ktp_i386.so was not produced — build.sh exits 0 on a failed compile, so check the compiler output above"; exit 1; }
          file "$SO" | grep -q 'ELF 32-bit' || { echo "::error::$SO is not a 32-bit ELF"; exit 1; }
          echo "Artifact OK:"
          ls -la "$SO"

  build-windows:
    name: Windows MSVC 32-bit build
    runs-on: windows-2022
    steps:
      - name: Configure
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      # appversion.bat derives the build number from the commit count, and
      # meta_api.cpp includes the appversion.h it writes — a shallow clone
      # produces a wrong number rather than an error.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Toolset comes from the project (v143). Don't pin it here too, or the two
      # disagree the next time it moves.
      - name: Build
        run: msbuild msvc\reapi.sln -p:Configuration=Release -p:Platform=Win32 -t:Rebuild -v:minimal

      # msbuild does return nonzero on failure, unlike build.sh, so this is not the
      # gate the Linux job's artifact check is. It is here to catch an OutDir or
      # TargetName change silently moving the .dll somewhere nothing collects it.
      - name: Verify artifact
        shell: pwsh
        run: |
          $dll = "msvc\Release\reapi_amxx.dll"
          if (-not (Test-Path $dll)) {
            Write-Output "::error::$dll was not produced"
            exit 1
          }
          Get-Item $dll | Format-List Name, Length, LastWriteTime
